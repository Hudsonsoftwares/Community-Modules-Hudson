# ============================================================================
#  render.yaml — Render Blueprint (Infrastructure as Code)
#
#  Deploy via: Render Dashboard → New → Blueprint → Connect your repo
#  Or manually create the services following this as a reference.
# ============================================================================

services:
  # ── Odoo 18 Web Service ──────────────────────────────────────────────────
  - type: web
    name: odoo18
    runtime: image
    image:
      url: docker.io/nandusaji/odoo18-custom:latest
    region: singapore
    plan: free
    healthCheckPath: /web/login
    envVars:
      # Database connection — uses the Internal URL from the Render PostgreSQL
      - key: DATABASE_URL
        fromDatabase:
          name: odoo-db
          property: connectionString
      # Odoo master password
      - key: ADMIN_PASSWORD
        value: admin
      # SSL mode for Render's internal PostgreSQL
      - key: DB_SSLMODE
        value: require
      # Set INIT_MODULES=base,web on FIRST deploy only, then remove it
      # - key: INIT_MODULES
      #   value: base,web

databases:
  # ── PostgreSQL for Odoo ──────────────────────────────────────────────────
  # NOTE: Free plan PostgreSQL expires after 90 days!
  - name: odoo-db
    plan: free
    region: singapore
    databaseName: odoo
    user: odoo
    postgresMajorVersion: "16"
