[options]
; ── Addon paths (base Odoo + all custom addon directories) ───────────────────
addons_path = /usr/lib/python3/dist-packages/odoo/addons,
    /mnt/extra-addons,
    /mnt/extra-addons/account-financial-reporting,
    /mnt/extra-addons/base_territory,
    /mnt/extra-addons/field-service,
    /mnt/extra-addons/helpdesk,
    /mnt/extra-addons/mis-builder,
    /mnt/extra-addons/partner-contact,
    /mnt/extra-addons/reporting-engine,
    /mnt/extra-addons/server-tools,
    /mnt/extra-addons/server-ux,
    /mnt/extra-addons/social,
    /mnt/extra-addons/stock-logistics-orderpoint,
    /mnt/extra-addons/web,
    /mnt/extra-addons/wms

; ── Security ─────────────────────────────────────────────────────────────────
admin_passwd = False

; ── Database (overridden by env vars in entrypoint.sh) ───────────────────────
db_host = localhost
db_port = 5432
db_user = odoo
db_password = odoo
db_name = False
db_maxconn = 4
db_sslmode = prefer
db_template = template0
dbfilter = .*

; ── Data / sessions ──────────────────────────────────────────────────────────
data_dir = /var/lib/odoo

; ── HTTP ─────────────────────────────────────────────────────────────────────
http_enable = True
http_interface = 0.0.0.0
http_port = 8069
proxy_mode = True

; ── Logging ──────────────────────────────────────────────────────────────────
log_handler = :INFO
log_level = info
logfile =

; ── Workers / Limits (tuned for Render FREE plan — 512MB RAM) ────────────────
; workers = 0 means threaded mode (single process). This uses much less RAM
; than multiprocessing and is the only viable option on the free 512MB plan.
; Cron is handled inside the same process in threaded mode.
workers = 0
max_cron_threads = 1
limit_memory_hard = 0
limit_memory_soft = 0
limit_time_cpu = 600
limit_time_real = 1200
limit_time_real_cron = 1800

; ── Misc ─────────────────────────────────────────────────────────────────────
csv_internal_sep = ,
default_productivity_apps = True
list_db = False
server_wide_modules = base,web
without_demo = True
unaccent = False
