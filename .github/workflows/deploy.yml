name: Build & Deploy to Render

# ── Trigger: push to main branch ─────────────────────────────────────────────
on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger from GitHub UI

env:
  DOCKERHUB_USER: nandusaji
  IMAGE_NAME: odoo18-custom
  IMAGE_TAG: latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout the full repo ──────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Copy custom addons into docker-deploy/addons/ ───────────────────
      - name: Prepare addons
        run: |
          rm -rf docker-deploy/addons
          mkdir -p docker-deploy/addons

          for dir in \
            account-financial-reporting \
            base_territory \
            field-service \
            helpdesk \
            mis-builder \
            partner-contact \
            reporting-engine \
            server-tools \
            server-ux \
            social \
            stock-logistics-orderpoint \
            web \
            wms
          do
            if [ -d "$dir" ]; then
              echo "Copying $dir ..."
              cp -r "$dir" docker-deploy/addons/
            else
              echo "WARNING: $dir not found, skipping."
            fi
          done

      # ── 3. Log in to Docker Hub ────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 4. Build and push Docker image ─────────────────────────────────────
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./docker-deploy
          file: ./docker-deploy/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # ── 5. Trigger Render deploy ───────────────────────────────────────────
      - name: Deploy to Render
        run: |
          curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo ""
          echo "Render deploy triggered!"
